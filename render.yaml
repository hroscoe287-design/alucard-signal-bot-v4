services:
  - type: web
    name: alucard-v4
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PO_WS_URL
        value: wss://api-us-south.po.market/socket.io/?EIO=4&transport=websocket
      - key: PO_AUTH_JSON
        sync: false
      - key: PO_ASSET
        value: EURUSD_otc
      - key: PO_TIMEFRAME
        value: 1m
      - key: MIN_CONFIDENCE
        value: "60"
      - key: STALE_SECONDS
        value: "8"
      - key: ENTRY_SECONDS
        value: "12"
